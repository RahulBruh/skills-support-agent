name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4  # the CDK (jsii) runtime needs Node
        with:
          node-version: 22
      - run: uv sync --group infra
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Validate skills
        run: uv run support-agent skills validate && uv run support-agent skills validate --skills-dir skills_v1
      - name: Unit, MCP, moto and CDK tests (no API key or AWS account needed)
        run: uv run --group infra pytest -q
