name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Validate skills
        run: uv run support-agent skills validate && uv run support-agent skills validate --skills-dir skills_v1
      - name: Unit + MCP integration tests (no API key needed)
        run: uv run pytest -q
